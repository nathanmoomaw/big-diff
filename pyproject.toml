[project]
name = "bigdiff"
version = "0.1.0"
description = "Diff tool for code review: changed symbols sorted by risk with their callers, plus JSON, CSV and image diffs."
requires-python = ">=3.11"
dependencies = [
    "tree-sitter-language-pack>=0.9",
    "pillow>=10",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
review = [
    "anthropic>=1.16,<2",
    "pydantic>=2",
]

[project.scripts]
bigdiff = "bigdiff.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
